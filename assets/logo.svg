<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0b1437"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>

  <!-- Trading card, slightly tilted -->
  <g transform="rotate(-10 120 132)">
    <rect x="62" y="44" width="116" height="164" rx="14" fill="url(#card)"/>
    <rect x="72" y="54" width="96" height="144" rx="8" fill="#13235c"/>
  </g>

  <!-- Rising price line -->
  <polyline points="52,186 98,146 128,164 190,92"
            fill="none" stroke="#22c55e" stroke-width="18"
            stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="208,70 210,124 160,98" fill="#22c55e"
           stroke="#22c55e" stroke-width="6" stroke-linejoin="round"/>

  <!-- Ball badge -->
  <g transform="translate(192 192)">
    <circle r="40" fill="#ffffff"/>
    <path d="M -40 0 A 40 40 0 0 1 40 0 Z" fill="#ef4444"/>
    <circle r="40" fill="none" stroke="#0b1437" stroke-width="7"/>
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#0b1437" stroke-width="7"/>
    <circle r="13" fill="#ffffff" stroke="#0b1437" stroke-width="7"/>
  </g>
</svg>
